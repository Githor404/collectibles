<!doctype html><meta charset="utf-8"><title>collectibles · data-layer gate</title><body>
<!--
  Re-runnable data-layer gate, ported from HealthTracker's harness. Self-contained:
  synthetic fixtures inline, a swappable fake localStorage per scenario. Exercises
  the REAL ../app.js, and loads the REAL ../index.html in an iframe for the shell
  cases. Run: bash tests/run-data-layer.sh

  THE VISION CONTRACT IS UNRULED (D1). The capture-chain cases install a SYNTHETIC
  contract through CT.setVisionContract. They prove the chain, never a contract.
-->
<script>
window.__keysEverWritten = {};
function makeFake(seed, failWrites){
  var m = Object.assign({}, seed || {});
  return {
    getItem: function(k){ return Object.prototype.hasOwnProperty.call(m,k) ? m[k] : null; },
    setItem: function(k,v){ if(failWrites) throw new Error('QuotaExceededError'); m[k] = String(v); window.__keysEverWritten[k] = true; },
    removeItem: function(k){ delete m[k]; },
    _get: function(k){ return Object.prototype.hasOwnProperty.call(m,k) ? m[k] : null; },
    _has: function(k){ return Object.prototype.hasOwnProperty.call(m,k); }
  };
}
window.__ls = null;
window.setLS = function(seed, failWrites){
  window.__ls = makeFake(seed, failWrites);
  Object.defineProperty(window, 'localStorage', { value: window.__ls, configurable: true });
};
window.setLS({});
</script>
<script src="../app.js"></script>
<script>
(function(){
  var pass = 0, fail = 0;
  function res(cond, name, extra){
    var p = document.createElement('p'); p.className = 'r';
    p.textContent = (cond ? 'PASS  ' : 'FAIL  ') + name + (!cond && extra ? '  :: ' + extra : '');
    document.body.appendChild(p);
    if (cond) pass++; else fail++;
  }
  function deepEqual(a, b){
    if (a === b) return true;
    if (typeof a !== 'object' || typeof b !== 'object' || a === null || b === null) return a === b;
    var ka = Object.keys(a), kb = Object.keys(b);
    if (ka.length !== kb.length) return false;
    for (var i=0;i<ka.length;i++){ var k=ka[i]; if(!Object.prototype.hasOwnProperty.call(b,k)) return false; if(!deepEqual(a[k],b[k])) return false; }
    return true;
  }
  window.__confirm = true;
  window.confirm = function(){ return window.__confirm; };
  // GATE INTEGRITY (HT-D35 addendum): a SYNCHRONOUS throw would otherwise still let
  // a green-looking SUMMARY print with a silently reduced count.
  window.addEventListener('error', function (e) {
    res(false, 'HARNESS: uncaught exception aborted the synchronous suite -- cases after it did NOT run', String(e.message) + ' @' + (e.lineno || '?'));
  });
  // Host elements the renderers paint into, mirroring the shell.
  //
  // D16: the comment here used to claim "that the SHELL has them is what the
  // iframe cases and layout-gate.ps1 prove." That was FALSE for #versionNotice
  // and #buildLine for an entire slice -- 17 assertions green against elements
  // index.html did not contain. So the claim is now a GATE rather than a
  // comment: mk() RECORDS every id it constructs, and an SH1 census requires
  // each to exist in the shipped shell. Recording rather than listing is the
  // point -- a hand-kept list would have covered the 14 in the array below and
  // silently missed the 10 constructed individually, which is the same
  // looks-complete-and-isn't failure the census exists to catch.
  var MK_IDS = [];
  (function ensureDOM(){
    var mk = function (tag, id, cls, parent) {
      if (MK_IDS.indexOf(id) < 0) MK_IDS.push(id);
      if (document.getElementById(id)) return document.getElementById(id);
      var e = document.createElement(tag); e.id = id; if (cls) e.className = cls;
      (parent || document.body).appendChild(e); return e;
    };
    ['storeBadge','dataStatus','captureBox','credBox-vision','credBox-prices','credBox-comps','confirmedBox','askBox','compsBox','versionNotice','buildLine','replyReport','toast','prerestoreWrap','wantsReport'].forEach(function (id) { mk('div', id); });
    // A TEXTAREA, not a div: renderWantsCard sets .value, and a div would accept
    // that property silently while meaning nothing -- a fixture that agrees with
    // the code instead of resembling the shell (D16).
    mk('textarea', 'replyBox'); mk('textarea', 'prerestoreBox'); mk('textarea', 'wantsBox');
    mk('div', 'outcomeScrim', 'scrim oscrim');
    var w = mk('div', 'captureOutcome', 'omodal');
    mk('b', 'outcomeTitle', '', w);
    mk('button', 'outcomeX', 'sheetx', w);
    var body = mk('div', 'outcomeBody', 'obody', w);
    mk('div', 'outcomeMsg', '', body);
    mk('div', 'captureResult', '', body);
    mk('div', 'outcomeFoot', 'ofoot', w);
  })();

  var SECRET = 'xai-SUPERSECRET-0123456789';
  var TOKEN = 'PCTOKEN-SECRET-' + '0123456789abcdef012345678';   // 40 chars, the documented length
  // R2b. Carries the real prefix so credKeyIssue's shape check passes cleanly --
  // a fixture that trips a warning tests the warning, not the thing under test.
  var CTOKEN = 'apify_api_' + 'SECRETCOMPS0123456789abcdef';
  // The SYNTHETIC contract. `probe` must be a string; every other key rides along,
  // so a long reply makes a long result (the scroll case).
  var OK_TEXT = '{"probe":"alpha","n":1}';
  var TEST_CONTRACT = {
    version: 9, acceptLabel: 'Use this',
    prompt: 'TEST CONTRACT: reply {"probe":"<word>","n":<number>}',
    parse: function (text) {
      var o; try { o = JSON.parse(CT.cleanJSON(text)); } catch (e) { return { ok: false, error: 'Bad JSON: ' + e.message }; }
      if (!o || typeof o !== 'object' || Array.isArray(o) || typeof o.probe !== 'string')
        return { ok: false, error: 'Expected {"probe":...}.' };
      return { ok: true, value: o };
    },
    accept: function (v) { window.__accepted = v; return { ok: true }; }
  };

  // ==========================================================================
  // S -- storage (HT-D1): prefixed stable key, forward guard, truthful badge
  // ==========================================================================
  setLS({}); CT.boot();
  var s = CT.state();
  res(CT.Store.tier === 'local', 'S1: tier local');
  res(s.kind === 'collectibles' && s.version === 1, 'S1: a fresh boot is kind collectibles, schema v1');
  res(deepEqual(s.settings, {}), 'S1: settings start empty -- nothing fabricated');
  res(__ls._has('collectibles-state'), 'S1: written under the PREFIXED stable key');
  res(CT.Store.status().ok === true, 'S1: badge ok');

  var futureBlob = JSON.stringify({ kind: 'collectibles', version: 2, settings: {}, futureField: 1 });
  setLS({ 'collectibles-state': futureBlob }); var r2 = CT.boot();
  res(r2.source === 'future', 'S2: a blob from a NEWER schema boots as future');
  res(__ls._get('collectibles-state') === futureBlob, 'S2: and is NOT overwritten (HT-D7 forward guard)');

  var NESTED = { kind: 'collectibles', version: 1, settings: { a: { b: [1, 2, { c: 'x' }] }, flag: true } };
  setLS({ 'collectibles-state': JSON.stringify(NESTED) }); var r3 = CT.boot();
  res(r3.source === 'store' && deepEqual(CT.state(), NESTED),
      'S3: a same-version blob boots from store with NESTED settings intact -- nothing an allowlist rebuild could drop');

  setLS({}); CT.boot();
  CT.Store.forceWriteFailure(true);
  res(CT.resave() === false, 'S4: a failed write reports failure');
  res(CT.Store.tier === 'memory' && CT.Store.status().ok === false, 'S4: degraded to memory, and the badge warns');
  res(/export/i.test(CT.Store.status().message), 'S4: the badge says to export');
  CT.Store.forceWriteFailure(false);

  setLS({}, true); CT.boot();
  res(CT.Store.tier === 'memory' && CT.Store.status().ok === false, 'S5: blocked storage (private mode) -> memory tier, badge honest');

  // ==========================================================================
  // E -- export / restore (HT-D3, HT-D5)
  // ==========================================================================
  var S1 = { kind: 'collectibles', version: 1, settings: { grades: ['9.4', '9.6'], nested: { k: { deep: 'v' } } } };
  setLS({ 'collectibles-state': JSON.stringify(S1) }); CT.boot();
  var exp1 = CT.exportJSON();
  setLS({}); CT.boot(); window.__confirm = true;
  var r7 = CT.restore(exp1);
  res(r7.ok && r7.kind === 'restore', 'E1: an export restores');
  res(deepEqual(CT.state(), S1), 'E1: export -> restore is IDENTITY, nested settings included');
  res(__ls._get('collectibles-state') === JSON.stringify(S1), 'E1: and what is stored is what was restored');

  setLS({}); CT.boot();
  var beforeE = JSON.stringify(CT.state());
  // A HealthTracker export: version 7, no `kind`. Without the kind check it would
  // be refused as "from a newer version" -- the wrong cause, stated confidently.
  var htExport = JSON.stringify({ version: 7, days: { '2026-07-08': { status: 'complete', items: [], water_l: 0 } }, current: '2026-07-08', settings: {} });
  var rHT = CT.restore(htExport);
  res(!rHT.ok && /not a collectibles export/i.test(rHT.error || '') && !/newer/i.test(rHT.error || ''),
      'E2 GATE: a HealthTracker export is refused as ANOTHER PRODUCT, not as "a newer version"', rHT.error);
  res(!__ls._has('collectibles-state-prerestore'), 'E2: a refused paste takes no backup');
  var rNoV = CT.restore(JSON.stringify({ kind: 'collectibles', settings: {} }));
  res(!rNoV.ok && /no version/i.test(rNoV.error || ''), 'E3: a version-absent export is refused');
  var rNew = CT.restore(futureBlob);
  res(!rNew.ok && /newer version/i.test(rNew.error || ''), 'E3: a newer-schema export is refused -- we never load down');
  res(!CT.restore('{ not json ]').ok && !CT.restore('[]').ok && !CT.restore('').ok, 'E3: bad JSON, an array and nothing are refused');
  res(JSON.stringify(CT.state()) === beforeE, 'E3: the state is untouched by every refused paste');

  setLS({}); CT.boot(); window.__confirm = true;
  CT.Store.forceWriteFailure(true);
  var r11 = CT.restore(JSON.stringify(S1));
  res(r11.ok && r11.backedUp === false, 'E4: under a write failure restore proceeds and does NOT claim a backup (HT-D3)');
  res(!__ls._has('collectibles-state-prerestore'), 'E4: no backup slot was written');
  res(CT.Store.tier === 'memory' && CT.Store.status().ok === false, 'E4: and the badge is honest');
  CT.Store.forceWriteFailure(false);

  setLS({}); CT.boot(); window.__confirm = true;
  var stateA = JSON.stringify(CT.state());
  CT.restore(JSON.stringify(S1));
  var slotA = __ls._get('collectibles-state-prerestore');
  res(slotA === stateA, 'E5: a restore backs up the prior state first');
  window.__confirm = false;
  var S1b = JSON.parse(JSON.stringify(S1)); S1b.settings.changed = 1;
  var rDecl = CT.restore(JSON.stringify(S1b));
  // Clause 4: the declined restore would have backed up S1, which DIFFERS from slotA.
  res(rDecl.aborted === true && __ls._get('collectibles-state-prerestore') === slotA,
      'E5 GATE: a DECLINED restore leaves the one level of undo exactly as it was');
  res(deepEqual(CT.state(), S1), 'E5: and the state is untouched');
  window.__confirm = true;

  setLS({}); CT.boot();
  var smart = '{' + String.fromCharCode(0x201C) + 'kind' + String.fromCharCode(0x201D) + ':' +
    String.fromCharCode(0x201C) + 'collectibles' + String.fromCharCode(0x201D) + ',' +
    String.fromCharCode(0x201C) + 'version' + String.fromCharCode(0x201D) + ':' + String.fromCharCode(0xA0) + '1}';
  res(CT.restore(smart).ok, 'E6: smart quotes and a non-breaking space are normalized, as a chat app delivers them');

  // ==========================================================================
  // K -- credentials (D1, HT-D45/D46/D49): outside the state, per role, merged
  // ==========================================================================
  var FETCHES = [];
  var FETCH_SCRIPT = [];
  window.fetch = function (url, init) {
    FETCHES.push({ url: String(url), init: init || {}, at: Date.now() });
    var next = FETCH_SCRIPT.shift();
    if (!next) return Promise.resolve({ ok: true, status: 200, text: function () { return Promise.resolve('{}'); } });
    if (next.reject) return Promise.reject(next.reject);
    return Promise.resolve({ ok: next.status < 400, status: next.status,
                             text: function () { return Promise.resolve(next.body); } });
  };
  function credReset() {
    FETCHES = []; FETCH_SCRIPT = [];
    CT.credClear('vision'); CT.credClear('prices'); CT.paceReset();
  }
  function withKeys() {
    credReset();
    CT.credSave('vision', 'grok', SECRET, 20);
    CT.credSave('prices', 'pricecharting', TOKEN);
    CT.credSave('comps', 'apify', CTOKEN);
  }
  function surfacesText() {
    return ['credBox-vision', 'credBox-prices', 'credBox-comps', 'captureBox', 'dataStatus', 'storeBadge', 'toast', 'outcomeMsg', 'outcomeTitle', 'outcomeFoot', 'captureResult', 'replyReport', 'confirmedBox', 'askBox', 'compsBox']
      .map(function (id) { var e = document.getElementById(id); return e ? e.innerHTML : ''; }).join('|');
  }

  setLS({}); CT.boot(); withKeys();
  res(CT.credConfigured('vision') && CT.credConfigured('prices') && CT.credConfigured('comps'), 'K1: all three credentials configure');
  var stj = JSON.stringify(CT.state());
  res(stj.indexOf(SECRET) < 0 && stj.indexOf(TOKEN) < 0 && stj.indexOf(CTOKEN) < 0,
      'K1 GATE: NO credential is in the state object -- nothing that serializes the state can carry one. ' +
      'Repointed for the comps token (HT-D60 Clause 3): a THIRD role must be covered by construction, not by a list that stopped at two');
  var expK = CT.exportJSON();
  res(expK.indexOf(SECRET) < 0 && expK.indexOf(TOKEN) < 0 && expK.indexOf('cred') < 0,
      'K1: absent from the export, and so is any trace of their stores');
  window.__confirm = true;
  CT.restore(expK);
  var slotK = __ls._get('collectibles-state-prerestore') || '';
  res(slotK.indexOf(SECRET) < 0 && slotK.indexOf(TOKEN) < 0, 'K1: absent from the pre-restore backup');
  res(CT.credSettings('vision').key === SECRET && CT.credSettings('prices').key === TOKEN,
      'K1: a destructive restore leaves both untouched -- different store, different lifetime');
  res(CT.credMask('vision').indexOf(SECRET) < 0 && CT.credMask('prices').indexOf(TOKEN) < 0 && CT.credMask('vision').indexOf('xai') === 0,
      'K1: the mask shows shape, never the credential');
  CT.refresh();
  var surfK = surfacesText();
  res(surfK.indexOf(SECRET) < 0 && surfK.indexOf(TOKEN) < 0, 'K1: no rendered surface carries either credential');
  CT.credClear('vision');
  res(!CT.credConfigured('vision') && String(localStorage.getItem('collectibles-cred-vision') || '').indexOf(SECRET) < 0,
      'K1: removing one leaves no residue');
  res(CT.credConfigured('prices'), 'K1: and does not touch the other role');

  withKeys();
  CT.credPatch('vision', { someFutureField: 'keep me' });
  CT.credSetStatus('vision', 'verified', '');
  CT.credCount('vision');
  CT.credSave('vision', 'grok', null, 7);
  var rawV = JSON.parse(localStorage.getItem('collectibles-cred-vision') || '{}');
  res(rawV.someFutureField === 'keep me' && rawV.status && rawV.status.state === 'verified' && rawV.cap === 7 && rawV.key === SECRET && rawV.used && rawV.used.n === 1,
      'K2 GATE (HT-D49): a field no writer knows survives the counter AND a save, beside the status, the cap and the key');
  CT.credSetStatus('prices', 'failed', 'x');
  res(CT.credSettings('vision').status.state === 'verified', 'K2: a write to one role cannot touch the other');
  res(CT.credSave('vision', 'grok', 'xai-A-COMPLETELY-DIFFERENT-KEY-0123', 7).ok === true && CT.credSettings('vision').status.state === 'unverified',
      'K2: replacing the credential still resets its status -- a merge must not keep a verdict about a different key');
  CT.credSave('vision', 'pricecharting', null, null);
  res(CT.credSettings('vision').provider === 'grok', 'K2: a provider from ANOTHER role cannot be assigned to this one');

  res(CT.credKeyIssue('grok', '').block === true, 'K3 (HT-D46): an empty key is refused');
  res(CT.credKeyIssue('grok', 'xai-with a space-0123456789').block === true, 'K3: an embedded space is refused');
  res(CT.credKeyIssue('grok', 'xai-short').block === true, 'K3: an implausibly short key is refused');
  var w1 = CT.credKeyIssue('grok', 'sk-someotherprovider-0123456789');
  res(w1 && w1.block === false && w1.message.indexOf('xai-') >= 0, 'K3: a surprising prefix WARNS and saves anyway');
  res(CT.credKeyIssue('grok', SECRET) === null, 'K3: a well-formed key raises nothing');
  var w2 = CT.credKeyIssue('pricecharting', TOKEN + 'X');
  res(w2 && w2.block === false && /40/.test(w2.message), 'K3: a token that is not the documented 40 characters warns, and saves anyway');
  res(CT.credKeyIssue('pricecharting', TOKEN) === null, 'K3: a 40-character token raises nothing');
  credReset();
  res(CT.credSave('prices', 'pricecharting', 'nope').blocked === true && CT.credConfigured('prices') === false, 'K3: a blocked save stores NOTHING');

  withKeys();
  res(CT.credSettings('vision').status.state === 'unverified' && CT.credStatusLine('vision') === 'not tested yet',
      'K4 (HT-D46): a newly saved key is UNVERIFIED, and says so');
  CT.credSetStatus('vision', 'verified', '');
  res(String(localStorage.getItem('collectibles-cred-vision') || '').indexOf('verified') >= 0 && CT.exportJSON().indexOf('verified') < 0,
      'K4: the status is stored WITH THE KEY, so the export carries no trace of it');

  withKeys();
  FETCHES = [];
  CT.boot(); CT.refresh(); CT.openSettings(); CT.closeSettings(); CT.renderCred('vision'); CT.renderCred('prices'); CT.renderCaptureBtn();
  CT.openCaptureResult('not json at all');
  window.__confirm = true; CT.restore(CT.exportJSON());
  res(FETCHES.length === 0, 'K5 (D1): boot, refresh, settings, a failed read and a restore issue ZERO calls');

  // ==========================================================================
  // V -- the vision contract seam ships EMPTY (D1: no features)
  // ==========================================================================
  // REPOINTED (HT-D60 Clause 3), not weakened. R1 ruled a contract, so the seam
  // is no longer empty -- and the guard it protects is still asserted, by
  // CLEARING the contract, which V2/V3 then drive through the whole capture chain.
  res(CT.visionReady() === true && CT.IDENTITY_CONTRACT.version === CT.ID_TEMPLATE_VERSION,
      'V1: the shipped contract is the identification contract, at the template version');
  res(typeof CT.IDENTITY_CONTRACT.parse === 'function' && typeof CT.IDENTITY_CONTRACT.render === 'function' &&
      CT.IDENTITY_CONTRACT.acceptLabel === 'Confirm',
      'V1: it carries a parser, a renderer and a confirm action -- the chain stays contract-agnostic around it');
  CT.setVisionContract(null);
  res(CT.visionReady() === false, 'V1: with the contract cleared the seam reports not ready');
  CT.renderCaptureBtn();
  var cbV = document.getElementById('captureBox').innerHTML;
  res(cbV.indexOf('not built yet') >= 0 && cbV.indexOf('Take photo') < 0,
      'V1: and the capture surface says so, offering no button that could only fail');
  res(CT.openCaptureResult(OK_TEXT).ok === false && CT.captureResult() === null,
      'V1: a reply cannot open a result when there is nothing to read it against');
  CT.setVisionContract(CT.IDENTITY_CONTRACT);

  // ==========================================================================
  // C -- the request contract (HT-D45, HT-D64, HT-D66) and the clocks (HT-D48)
  // ==========================================================================
  var b1 = CT.visionBody('data:image/jpeg;base64,AAAA', 'TEXT', 'grok-4.6', CT.visionCaps(CT.PROVIDERS.grok, {}));
  var c1 = b1.messages[0].content;
  res(b1.model === 'grok-4.6' && c1.length === 2 && c1[0].type === 'image_url' && c1[0].image_url.url.indexOf('data:image/jpeg;base64,') === 0 && c1[1].type === 'text' && c1[1].text === 'TEXT',
      'C1: one user message, an OpenAI-CLASSIC image part and a text part -- the shape the endpoint accepts');
  res(b1.response_format && b1.response_format.type === 'json_object' && b1.max_tokens > 0 && b1.max_tokens <= 4096,
      'C1 (HT-D64): JSON is asked for STRUCTURALLY, and the answer is bounded');
  res(b1.reasoning_effort === 'low', 'C1 (HT-D66): the capture asks for the LOW reasoning floor');
  var capsOff = CT.visionCaps(CT.PROVIDERS.grok, { noEffort: true });
  var capsNoJson = CT.visionCaps(CT.PROVIDERS.grok, { noJsonMode: true });
  res(capsOff.reasoningEffort === null && capsOff.jsonMode === true && capsNoJson.jsonMode === false && capsNoJson.reasoningEffort === 'low',
      'C1 (HT-D66): the two degrade flags are INDEPENDENT, in both directions');
  var undeclared = CT.visionCaps({ role: 'vision', label: 'x', base: 'b', model: 'm' }, {});
  res(!undeclared.reasoningEffort && !undeclared.jsonMode &&
      CT.visionBody('data:,x', 'p', 'm', undeclared).reasoning_effort === undefined &&
      CT.visionBody('data:,x', 'p', 'm', undeclared).response_format === undefined,
      'C1: a provider that declares neither field is sent neither -- asserted through visionCaps, not a null (HT-D60 Clause 4)');
  res(CT.PROVIDERS.grok.base === 'https://api.x.ai/v1' && CT.PROVIDERS.grok.auth === 'bearer' &&
      CT.PROVIDERS.pricecharting.base === 'https://www.pricecharting.com' && CT.PROVIDERS.pricecharting.auth === 'query' &&
      CT.PROVIDERS.pricecharting.authParam === 't' && CT.PROVIDERS.pricecharting.minIntervalMs >= 1000,
      'C1 (D1): the verified endpoints, auth styles and the 1 call/s pacing are the shipped rows');
  CT.setVisionContract(TEST_CONTRACT);
  res(CT.visionPrefix().indexOf('v' + TEST_CONTRACT.version) >= 0 && CT.visionPrefix().indexOf('ONLY') >= 0,
      'C2 (HT-D45 Fork B): the preamble is a prefix CARRYING the contract version, not a forked prompt');
  var T0 = CT.byokTimeouts();
  res(T0.call >= 90000 && T0.test <= 20000 && T0.call >= T0.test * 4,
      'C3 (HT-D48): two clocks -- the capture budget is long, the test budget short, and capture at least 4x test');
  res(T0.decode > 0 && T0.lease > 0 && T0.lease < T0.decode,
      'C3 (HT-D47): the decoder LEASH sits inside the decode budget, so the fallback always gets a turn');
  res(CT.BYOK_RETRY_MIN_MS > 0 && CT.BYOK_RETRY_MIN_MS < T0.call, 'C3 (HT-D64): a retry floor exists inside the call budget');

  // ==========================================================================
  // P -- one door, and the result surface is escaped
  // ==========================================================================
  document.getElementById('replyBox').value = OK_TEXT;
  CT.doReplyPaste();
  var viaPaste = JSON.stringify(CT.captureResult());
  CT.captureDiscard();
  CT.openCaptureResult(OK_TEXT);
  var viaDoor = JSON.stringify(CT.captureResult());
  CT.captureDiscard();
  res(viaPaste === viaDoor && viaPaste.indexOf('alpha') >= 0,
      'P1 (HT-D45): identical reply text gives a BYTE-IDENTICAL result, pasted or called -- one door');
  CT.openCaptureResult('{"probe":"<img src=x onerror=alert(1)>","n":1}');
  var crP = document.getElementById('captureResult').innerHTML;
  res(crP.indexOf('<img src=x') < 0 && crP.indexOf('&lt;img') >= 0, 'P2: a hostile string in a reply is ESCAPED on the result surface');
  CT.captureDiscard();

  // ==========================================================================
  // R -- redaction (D1): a provider's words may carry the credential back
  // ==========================================================================
  res(CT.providerMessage('{"error":"bad token ' + TOKEN + ' rejected"}', TOKEN).indexOf(TOKEN) < 0 &&
      CT.providerMessage('{"error":"bad token ' + TOKEN + ' rejected"}', TOKEN).indexOf('[redacted]') >= 0,
      'R1 GATE: a provider that ECHOES the credential has it redacted before any surface sees it');
  res(CT.providerMessage('{"error":"Must provide an access token","error-message":"Must provide an access token","status":"error"}', TOKEN) === 'Must provide an access token',
      'R1: the PriceCharting error shape verified 2026-09-11 is read as written');

  // ==========================================================================
  // ASYNC -- the call path, the capture chain and the shipped shell. Registered
  // as ordered STEPS and run after the shell iframe loads, so the suite still
  // finishes exactly once.
  // ==========================================================================
  var STEPS = [];
  function step(fn) { STEPS.push(fn); }
  function tick(ms) { return new Promise(function (r) { setTimeout(r, ms || 0); }); }
  var OK_REPLY = '{"choices":[{"message":{"content":' + JSON.stringify(OK_TEXT) + '}}]}';
  var JUNK = '{"choices":[{"message":{"content":"sorry, I cannot"}}]}';
  var SCRIPTED_FETCH = window.fetch;
  // Honours the abort signal, like a real fetch: a stub that ignores it leaves a
  // promise pending for the rest of the run (HT-R21.3's harness hang).
  function hangFetch() {

  res(CT.askState().ask === 30 && CT.askState().terms === '5 for $40',
      'AK9 GATE (D12): the terms are kept VERBATIM beside the user figure -- nothing parses them');
  res(akBoth().indexOf('5 for $40') >= 0 && akBoth().indexOf('your figure') >= 0,
      'AK9 GATE (D12): the surface names the figure as the USER\'S and shows the seller\'s words as its source');
  // WAS A TAUTOLOGY on first writing: `JSON.stringify(...).indexOf('8') !== 1`
  // is a typo for an absence check and is true for almost any string -- the CQ7
  // failure mode exactly, caught here before it could be banked as evidence.
  // The real claim: no rendered price equals 8, and no state field holds 8.
  // WIDENED after its own defect row exposed the hole: this checked rendered
  // .cmpprice values, state.ask and state.terms -- and a divided per-book figure
  // rendered in the MARKER'S TITLE is none of the three, so the assertion could
  // not catch the defect it is named for. "Nowhere" has to mean nowhere.
  var st9 = CT.askState();
  res(akPrices(akBoth()).indexOf(8) < 0 && st9.ask !== 8 &&
      String(st9.terms).indexOf('$8') < 0 && akBoth().indexOf('$8') < 0,
      'AK9 GATE (D12): $40 / 5 = $8 appears NOWHERE -- not as a price, not in state, not anywhere in the rendered surface. The app never divides a seller\'s quote',
      JSON.stringify(st9));

  // Fork F: a scatter in two currencies is incomparable; say so, do not place.
  var mixed = akRows.slice(0, 3).map(function (r) { return JSON.parse(JSON.stringify(r)); });
  mixed[2].soldCurrency = 'GBP';
  CT.__setComps(mixed, [], 'q'); CT.renderAsk(); CT.askSetPrice('20');
  res(CT.askComparison().mixed === true,
      'AK10 GATE (Fork F): a mixed-currency scatter REFUSES the comparison rather than placing an ask among incomparable numbers');
  res(document.getElementById('askBox').innerHTML.indexOf('more than one currency') >= 0,
      'AK10 GATE: and states why, where the numbers are');

  // Brief rules 3 and 5: the human inputs never reach a request body.
  akSeed(); CT.askSetPrice('30'); CT.askSetGrade('VF-');
  res(CT.compsBodyIsClean(CT.compsBody(CT.compsQuery())) === true &&
      JSON.stringify(CT.compsBody(CT.compsQuery())).indexOf('30') < 0,
      'AK11 GATE (brief rules 3,5): neither the ask nor the grade reaches a request body -- CQ4 moves from theoretical to load-bearing now that real inputs exist');

  // The caret hazard, gated structurally: typing must not replace the element.
  var inputRef = document.getElementById('askPrice');
  CT.askSetPrice('31');
  res(document.getElementById('askPrice') === inputRef,
      'AK12 GATE: typing into the ask does NOT rebuild it -- renderComps rewrites innerHTML on every keystroke, and an input inside it would lose the caret per character');

  // Fork D: a new book inherits nothing; a re-lookup keeps it.
  CT.clearConfirmed();
  res(CT.askState().ask === null && CT.askState().grade === '' && CT.askState().terms === '',
      'AK13 GATE (Fork D): Start over clears the ask, the terms and the grade -- a seller\'s price carried onto a different book is brief rule 8\'s confidently-wrong pairing');

  // THE TIE-AT-THE-ASK BOUNDARY. Every case above leaves `at` at zero, so the
  // pre-registered claim "below + at + above = the rendered count" has never
  // exercised its middle term -- HT-D60 Clause 4, the same shape as a fixture
  // with no ties in it at all. The four sales at $25 exist to make this
  // reachable, and until now nothing used them.
  akSeed(); CT.askSetPrice('25');
  var c25 = CT.askComparison();
  res(c25.below === 2 && c25.at === 4 && c25.above === 3,
      'AK14 GATE: sales at EXACTLY the ask are counted as their own term -- 2 below, 4 at, 3 above',
      c25.below + '/' + c25.at + '/' + c25.above);
  res(c25.below + c25.at + c25.above === c25.total && c25.total === 9,
      'AK14 GATE: and the three still sum to the rendered count when the tie term is NON-ZERO -- which is the only arrangement that can catch an off-by-one at the boundary');
  res(akPrices(document.getElementById('compsBox').innerHTML).join(',') === '9,16.21,25,25,25,25,25,40,52.46,145',
      'AK14 GATE (Fork E): the marker sits AFTER the sales that matched it -- an equal sale is not "above" the ask, and placing the marker by value rather than by index is what keeps that true',
      akPrices(document.getElementById('compsBox').innerHTML).join(','));

  // ======== VN: build identity -- which version, and what changed ============
  // The version machinery shipped with NO coverage at all, which is the state
  // HT-D6 records as fatal: HealthTracker's hand-bumped integer was missed on
  // every slice after Phase 0 and served a frozen shell, silently, in both
  // directions. These are the assertions that would have said so.
  res(CT.cmpVersion('0.2.0', '0.10.0') < 0 && CT.cmpVersion('0.3.0', '0.3.0') === 0 &&
      CT.cmpVersion('1.0.0', '0.9.9') > 0,
      'VN1 GATE: cmpVersion compares NUMERICALLY per segment -- a string compare puts 0.10.0 before 0.2.0 and would quietly stop showing notices after the ninth release');

  res(CT.versionNotice(CT.APP_VERSION) === null,
      'VN2: the running version stored -> no notice');
  res(CT.versionNotice('9.9.9') === null,
      'VN2 GATE: a DOWNGRADE shows no notice -- an older build must not announce itself as an update');
  var vnUp = CT.versionNotice('0.0.1');
  res(!!vnUp && vnUp.from === '0.0.1' && vnUp.to === CT.APP_VERSION,
      'VN2: an older stored version -> a notice carrying from and to', JSON.stringify(vnUp && { f: vnUp.from, t: vnUp.to }));

  var vnFresh = CT.versionNotice(null);
  res(!!vnFresh && vnFresh.from === null && vnFresh.notes.length === 1 &&
      vnFresh.notes[0].v === CT.APP_VERSION,
      'VN3: nothing stored -> the current line only, never the whole history');

  // Accumulation, against an INJECTED log -- unreachable with the one entry that
  // ships, so the real log cannot exercise it (Clause 4).
  var synth = [{ v: '0.1.0', d: '2026-09-14', note: 'a' }, { v: '0.2.0', d: '2026-09-15', note: 'b' },
               { v: '0.3.0', d: '2026-09-16', note: 'c' }];
  var jump = CT.versionNotesBetween('0.1.0', '0.3.0', synth);
  res(jump.length === 2 && jump[0].v === '0.2.0' && jump[1].v === '0.3.0',
      'VN4 GATE: a multi-version jump accumulates EVERY skipped release, not just the newest -- the case that cannot occur until it does',
      jump.map(function (e) { return e.v; }).join(','));
  res(CT.versionNotesBetween('0.2.0', '0.3.0', synth).length === 1,
      'VN4: a single-step jump carries just that release');

  res(CT.VERSION_LOG[CT.VERSION_LOG.length - 1].v === CT.APP_VERSION,
      'VN5 GATE: the newest VERSION_LOG entry IS APP_VERSION -- check-version.sh gates this too, and a shipped update with no changelog line is what it prevents');
  res(CT.VERSION_LOG.every(function (e) { return /^\d{4}-\d{2}-\d{2}$/.test(e.d || ''); }),
      'VN5 GATE: EVERY entry carries a release date (ruled 2026-09-14) -- HealthTracker exempts pre-convention entries; there are none here, so the exemption would protect nobody');
  res(CT.versionLine().indexOf('collectibles v' + CT.APP_VERSION) === 0 &&
      CT.versionLine().indexOf('released') > 0,
      'VN5: the build line names the product, the version and the release date', CT.versionLine());

  // The notice fires ONCE, and the write happens before the render.
  setLS({}); CT.boot();
  try { localStorage.removeItem(CT.VERSION_KEY); } catch (e) {}
  res(CT.appSource() === 'empty' && CT.checkVersionNotice() === null,
      'VN6 GATE: a GENUINE first run shows no "updated" notice -- APP_SOURCE separates a fresh install from a restore and from the unversioned builds', CT.appSource());
  res(localStorage.getItem(CT.VERSION_KEY) === CT.APP_VERSION,
      'VN6: and the running version is persisted anyway, so the next load is quiet');

  // The EXPORTED key, not a literal. Spelling it out by hand would seed a key
  // boot() never reads, APP_SOURCE would come back 'empty', and VN7 would fail
  // for a reason unrelated to what it tests.
  var vnSeed = {};
  vnSeed[CT.keys.STORE_KEY] = JSON.stringify({ kind: CT.STATE_KIND, version: CT.SCHEMA_VERSION, settings: {} });
  setLS(vnSeed);
  CT.boot();
  try { localStorage.removeItem(CT.VERSION_KEY); } catch (e) {}
  document.getElementById('versionNotice').innerHTML = '';
  var vnExisting = CT.checkVersionNotice();
  res(CT.appSource() === 'store' && !!vnExisting && vnExisting.from === null,
      'VN7 GATE: someone already running an UNVERSIONED build DOES get the notice -- for them this is an update, and nothing stored is not the same as nothing installed', CT.appSource());
  res(document.getElementById('versionNotice').innerHTML.indexOf('Updated to v' + CT.APP_VERSION) >= 0,
      'VN7: and it renders, naming the version they arrived at');
  res(CT.checkVersionNotice() === null,
      'VN7 GATE: a second call is silent -- the notice fires once per change, not once per load');
  CT.dismissVersionNotice();
  res(document.getElementById('versionNotice').innerHTML === '',
      'VN8: dismissing clears it');

  res(String(CT.VERSION_KEY).indexOf('collectibles-') === 0,
      'VN8 GATE (D1): the version key is prefixed -- a shared GitHub Pages origin shares storage with HealthTracker');

  // ==========================================================================
  // W -- D15: the want-list, a capture-time filter
  // ==========================================================================
  res(CT.wantNormTitle('The Amazing Spider-Man') === CT.wantNormTitle('amazing spider-man') &&
      CT.wantNormTitle('The Amazing Spider-Man') === 'amazing spider man',
      'W1 GATE (D15): generosity is about FORMAT -- case, a leading "The" and punctuation normalise away, so one want typed two ways is one want',
      CT.wantNormTitle('The Amazing Spider-Man'));
  res(CT.wantNormIssue('#007') === '7' && CT.wantNormIssue('129') === '129' && CT.wantNormIssue('#2a') === '2a',
      'W2 GATE (D15): the # and leading zeros are format too -- "#007" and "7" are one issue',
      CT.wantNormIssue('#007') + '/' + CT.wantNormIssue('#2a'));
  var w3 = CT.parseWantLine('  The Amazing Spider-Man #129  ');
  res(w3.raw === 'The Amazing Spider-Man #129' && w3.title === 'amazing spider man' && w3.issue === '129',
      'W3 GATE (D4 shape): the RAW line is kept BESIDE the normalised form -- the normalised form is the app working object, the raw line belongs to the person who typed it',
      JSON.stringify(w3));

  setLS({});
  CT.boot();
  CT.wantsSave('The Amazing Spider-Man #129\nFantastic Four 51');
  res(!!CT.wantMatch({ title: 'Amazing Spider-Man', issue: '129' }) &&
      !!CT.wantMatch({ title: 'the amazing spider-man', issue: '#129' }) &&
      !!CT.wantMatch({ title: 'Fantastic Four', issue: '051' }),
      'W4 GATE (D15): a reading matches a want TYPED DIFFERENTLY -- "Amazing Spider-Man 129" hits "The Amazing Spider-Man #129", and "051" hits "51"');
  // THE RULING, and the reason for it. Firing on title alone would flag every
  // ASM in the box. D15 says err toward firing because a miss is the expensive
  // error -- but false hits do not stay independent: they compound into a flag
  // that gets ignored, and an ignored flag turns every later false hit into a
  // MISS. The cheap error, repeated, becomes the expensive one.
  res(CT.wantMatch({ title: 'Amazing Spider-Man', issue: '130' }) === null &&
      CT.wantMatch({ title: 'Amazing Spider-Man', issue: '' }) === null &&
      CT.wantMatch({ title: 'Some Other Book', issue: '129' }) === null,
      'W5 GATE (D15 amended): a DIFFERENT ISSUE IS A DIFFERENT BOOK -- title-only would flag every ASM in the box, and a flag you learn to ignore is worse than no flag');

  var w6 = CT.wantsSave('Amazing Spider-Man #129\nsome book whose number I forget');
  res(w6.saved === 2 && w6.unmatchable === 1 &&
      CT.wantsList()[1].raw === 'some book whose number I forget' && CT.wantsList()[1].matchable === false,
      'W6 GATE (D15): a line with NO issue is KEPT and COUNTED as unmatchable -- never silently dropped, because the list is the persons own text',
      JSON.stringify(w6));
  CT.renderWantsCard();
  res(document.getElementById('wantsReport').innerHTML.indexOf('NEVER match') >= 0,
      'W6 GATE (D15): and the card SAYS SO -- a filter that quietly ignores part of your list has spent the expensive error to save the cheap one',
      document.getElementById('wantsReport').textContent);

  CT.wantsSave('The Amazing Spider-Man #300');
  var w7 = CT.wantFlagHTML({ fields: { title: 'Amazing Spider-Man', issue: '300' } });
  res(w7.indexOf('The Amazing Spider-Man #300') >= 0 && w7.indexOf('wantflag') >= 0,
      'W7 GATE (D4 shape): the flag shows the persons OWN line back, never the apps normalisation of it', w7);

  var wPrevContract = CT.setVisionContract(CT.IDENTITY_CONTRACT);
  CT.captureDiscard();
  var w8before = JSON.stringify(CT.wantsList());
  CT.openCaptureResult(CT.ID_SAMPLE);
  res(document.getElementById('wantFlag').innerHTML.indexOf('wantflag') >= 0 &&
      CT.confirmedIdentity() === null && JSON.stringify(CT.wantsList()) === w8before,
      'W8 GATE (D15): the flag fires on the DRAFT and writes NOTHING -- no record before confirm, and the list is untouched by having matched');

  // THE SEAM (D16). identitySetField deliberately does NOT rebuild the draft --
  // retyping must not cost the caret -- so a flag painted only by
  // renderIdentityHTML would show a stale answer to a question already changed.
  // BOTH DIRECTIONS, because a one-way check passes against an element that
  // never changes at all, which is exactly what __setComps did.
  CT.identitySetField('issue', '301');
  res(document.getElementById('wantFlag').innerHTML.indexOf('wantflag') < 0,
      'W9 GATE (D15/D16): correcting the issue REMOVES the flag -- it re-evaluates as the reading is corrected, in place, without rebuilding the inputs');
  CT.identitySetField('issue', '300');
  res(document.getElementById('wantFlag').innerHTML.indexOf('wantflag') >= 0,
      'W9 GATE (D16): and correcting it BACK restores it -- the other direction, so this cannot pass against a flag that simply never changes');

  CT.wantsSave('Fantastic Four #51');
  CT.boot();
  res(CT.wantsList().length === 1 && CT.wantsList()[0].raw === 'Fantastic Four #51',
      'W10 GATE (Option A): wants survive a BOOT -- normalizeState preserves settings wholesale, which is why this needed NO schema bump and took on none of the wipe risk a bump carries',
      JSON.stringify(CT.wantsList()));
  var w11 = CT.wantsSave('Daredevil #168');
  res(w11.ok === (CT.Store.status().ok === true),
      'W11 (D1): wantsSave REPORTS the storage outcome rather than assuming it -- a want that was not saved must not claim it was',
      JSON.stringify(w11));
  CT.wantsSave('');
  CT.captureDiscard();
  CT.setVisionContract(wPrevContract);

  // ---- ID15 (R1.2): an issue that ARRIVES with a # renders with exactly one --
  // From the first device capture: STAR WARS #2 came back with issue "#2" -- as
  // printed, exactly as the contract asks -- and the header prepended a second,
  // rendering "STAR WARS ##2". The query was correct, so it was display only.
  // These read the HEADER ELEMENT, not the whole draft. The issue INPUT
  // legitimately renders value="##2", because the field keeps what was printed --
  // a first version of this case searched the document for "##" and failed for
  // exactly that reason. The measurement was wrong, not the fix.
  function idHead(h) { var m = /<div class="idhead">([\s\S]*?)<\/div>/.exec(h); return m ? m[1] : '(no header)'; }
  function cfHead(h) { var m = /<div class="cfhead">([\s\S]*?)<\/div>/.exec(h); return m ? m[1] : '(no header)'; }
  function draftHTML() { return document.getElementById('captureResult').innerHTML; }
  CT.captureDiscard(); CT.clearConfirmed();
  CT.openCaptureResult('{"title":"STAR WARS","issue":"#2","publisher":"MARVEL","cover_price":"$1.00","markers":["newsstand"]}');
  res(idHead(draftHTML()) === 'STAR WARS #2',
      'ID15 GATE (R1.2): an issue already carrying a # renders with EXACTLY one in the draft header', idHead(draftHTML()));
  res(CT.identityQuery(CT.captureResult().value) === 'STAR WARS #2',
      'ID15: and the search string is untouched by the display rule -- it was already right');
  CT.captureAccept();
  res(cfHead(document.getElementById('confirmedBox').innerHTML) === 'Confirmed: STAR WARS #2',
      'ID15 GATE: and so does the CONFIRMED header -- the surface the bug was reported from',
      cfHead(document.getElementById('confirmedBox').innerHTML));
  CT.clearConfirmed();
  CT.openCaptureResult('{"title":"Daredevil","issue":"1","markers":[]}');
  res(idHead(draftHTML()) === 'Daredevil #1',
      'ID15 CONTROL: a bare issue still gets its # -- the fix adds one where it is missing, it does not stop adding');
  CT.captureDiscard();
  CT.openCaptureResult('{"title":"X","issue":"##2","markers":[]}');
  res(idHead(draftHTML()) === 'X #2',
      'ID15: two leading hashes collapse to one in the header -- the rule is exactly one, whatever arrives', idHead(draftHTML()));
  res(draftHTML().indexOf('value="##2"') >= 0,
      'ID15 GATE: and the FIELD still shows what the model sent -- the normalisation is display-only, never a rewrite of the reading');
  CT.captureDiscard();

  // ---- ID10: every field is escaped on the way to both surfaces -------------
  CT.openCaptureResult('{"title":"<img src=x onerror=alert(1)>","issue":"\\"><b>x</b>","markers":["newsstand"]}');
  var h10 = document.getElementById('captureResult').innerHTML;
  res(h10.indexOf('<img src=x') < 0 && h10.indexOf('&lt;img') >= 0 && h10.indexOf('<b>x</b>') < 0,
      'ID10: a hostile string in any field is escaped on the identity surface');
  CT.captureAccept();
  res(document.getElementById('confirmedBox').innerHTML.indexOf('<img src=x') < 0, 'ID10: and on the confirmed surface too');
  CT.clearConfirmed(); CT.captureDiscard();

  // ---- ID12: vocabulary, with a planted control -----------------------------
  CT.openCaptureResult(CT.ID_SAMPLE);
  var surface12 = String(document.getElementById('captureResult').textContent || '').toLowerCase();
  var banned12 = ['worth', 'estimated value', 'market value', 'should', 'rare', 'valuable', 'investment'];
  var hit12 = banned12.filter(function (w) { return surface12.indexOf(w) >= 0; });
  res(hit12.length === 0, 'ID12: no valuation or evaluative vocabulary reaches the identity surface' + (hit12.length ? ' [' + hit12.join(',') + ']' : ''));
  res(banned12.filter(function (w) { return (surface12 + ' this one is valuable and rare').indexOf(w) >= 0; }).length >= 2,
      'ID12 CONTROL: the same test fires on planted text, so it is not vacuous');
  CT.captureDiscard();

  // ---- ID11: the no-key floor, on the SHIPPED shell, content and outcome ----
  step(function () {
    var R = window.__W;
    if (!R) { res(false, 'ID11: the shipped shell was not available'); return; }
    var W = R.W, D = R.D;
    W.CT.setVisionContract(W.CT.IDENTITY_CONTRACT);
    W.CT.credClear('vision');                       // the floor is the NO-KEY route
    W.CT.refresh();
    var boxes = W.CT.promptBoxes();
    res(boxes.length === 2 && boxes.every(function (b) { return String(b.value).indexOf('identify a comic book') >= 0; }),
        'ID11 GATE (HT-D63): BOTH prompt boxes in the shipped shell hold the prompt after a render -- content, not presence',
        boxes.map(function (b) { return String(b.value).length; }).join('/'));
    boxes.forEach(function (b) { b.value = ''; });   // Clause 4: measure the copy, not the boot
    var cp = W.CT.copyPrompt(boxes[1]);
    res(cp.ok === true && String(boxes[1].value).indexOf('identify a comic book') >= 0,
        'ID11 GATE: Copy fills the box UNCONDITIONALLY, so "select it and copy" is followable whatever the clipboard does');
    res(String(boxes[0].value) === '', 'ID11: and it fills the box the finger was on, not the first in the document');
    W.CT.captureDiscard(); W.CT.clearConfirmed();
    D.getElementById('replyBox').value = W.CT.ID_SAMPLE;
    W.CT.doReplyPaste();
    res(W.CT.captureOutcomeState() === 'success' && !!W.CT.captureResult() &&
        D.getElementById('outcomeFoot').innerHTML.indexOf('captureAccept()') >= 0,
        'ID11 GATE: with NO key at all, a pasted reply opens the SAME modal with the same actions -- the floor works end to end');
    W.CT.captureDiscard(); W.CT.refresh();
  });

  // ---- ID13: one door, with the SHIPPED contract ----------------------------
  step(function () {
    var R = window.__W;
    if (!R) { res(false, 'ID13: the shipped shell was not available'); return; }
    var W = R.W;
    W.CT.setVisionContract(W.CT.IDENTITY_CONTRACT);
    R.wReset();
    R.WF.script = [{ status: 200, body: '{"choices":[{"message":{"content":' + JSON.stringify(CT.ID_SAMPLE) + '}}]}' }];
    return R.wImage(1400, 1050).then(function (f) {
      return R.wFireFrom('captureFile', f).then(function () {
        var cr = W.CT.captureResult();
        var viaCall = cr ? JSON.stringify(cr.value) : '(no result)';
        W.CT.captureDiscard();
        W.CT.openCaptureResult(W.CT.ID_SAMPLE);
        var viaPaste = JSON.stringify(W.CT.captureResult().value);
        res(viaCall === viaPaste && viaCall.indexOf('Amazing Spider-Man') >= 0,
            'ID13 GATE: the SHIPPED contract gives a byte-identical identity whether it arrived by call or by paste -- one door');
        var sent = String((R.WF.calls[0] || { init: {} }).init.body || '');
        res(sent.indexOf('Contract v1') > 0 && sent.indexOf('identify a comic book') > 0,
            'ID13: and the call carried the contract prompt behind its version prefix');
        W.CT.captureDiscard();
      });
    });
  });

  // ---- run ------------------------------------------------------------------
  var seDone = false;
  function finish() {
    if (seDone) return;
    seDone = true;
    var sm = document.createElement('p'); sm.className = 's';
    sm.textContent = 'SUMMARY ' + pass + '/' + (pass + fail) + (fail ? (' -- ' + fail + ' FAILED') : ' -- ALL PASS');
    document.body.appendChild(sm);
  }
  var seFrame = document.createElement('iframe');
  seFrame.style.cssText = 'width:390px;height:700px;border:0';
  var sePending = true;
  // Appending an iframe fires `load` once for about:blank BEFORE the real document.
  seFrame.onload = function () {
    var d = seFrame.contentDocument;
    if (!d || !d.getElementById('captureOutcome')) return;
    if (!sePending) return;
    sePending = false;
    STEPS.reduce(function (chain, fn) { return chain.then(function () { return fn(); }); }, Promise.resolve())
      .then(finish, function (e) {
        res(false, 'ASYNC: a step threw -- the steps after it did NOT run', String(e && e.message));
        finish();
      });
  };
  seFrame.src = '../index.html';
  document.body.appendChild(seFrame);
  // Safety net: an iframe that never loads still ends in a SUMMARY, loudly.
  setTimeout(function () {
    if (sePending) { res(false, 'SH: the shipped index.html did not load into the harness iframe'); sePending = false; finish(); }
  }, 15000);
})();
</script>
</body>
